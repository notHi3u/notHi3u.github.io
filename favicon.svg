<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --reticle-color: #dc2626;
      --cube-color: #dc2626;
      --dot-color: #f8f9fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --reticle-color: #00f0ff;
        --cube-color: #00f0ff;
        --dot-color: #12151b;
      }
    }
  </style>

  <!-- 4 Reticle HUD Bracket Corners -->
  <path d="M3 10 L3 3 L10 3" stroke="var(--reticle-color)" stroke-width="2.2" stroke-linecap="square" fill="none" />
  <path d="M22 3 L29 3 L29 10" stroke="var(--reticle-color)" stroke-width="2.2" stroke-linecap="square" fill="none" />
  <path d="M3 22 L3 29 L10 29" stroke="var(--reticle-color)" stroke-width="2.2" stroke-linecap="square" fill="none" />
  <path d="M22 29 L29 29 L29 22" stroke="var(--reticle-color)" stroke-width="2.2" stroke-linecap="square" fill="none" />

  <!-- Ground Rail Line -->
  <line x1="4" y1="24.5" x2="28" y2="24.5" stroke="var(--reticle-color)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Rolling Pawn Cube (tilted at 45 deg, apex centered on ground) -->
  <g transform="translate(16, 19.5) rotate(45)">
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="1.2" fill="var(--cube-color)" />
    <circle cx="0" cy="0" r="1.6" fill="var(--dot-color)" />
  </g>
</svg>
